<p>Rolling out Claude Desktop for macOS in your org? You'll probably want to stop users logging in with their personal accounts — here's how to enforce your org's account:</p>

<pre><code id="code"></code></pre>

<script>
  document.getElementById('code').textContent = `
<key>PayloadType</key>
<string>com.anthropic.claudefordesktop</string>
<key>forceLoginOrgUUID</key>
<string>xxx</string>`;
</script>
